<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>İstanbul Ulaşım — Metro, metrobüs & otobüs</title>
  <meta name="description" content="İstanbul metro, tramvay, metrobüs ve otobüs hatlarında sıradaki sefer kaç dakika sonra? Resmî tarifeler, canlı hat durumu ve İETT durak varışları." />
  <meta name="theme-color" id="themeColor" content="#0d1117" />
  <script>
    try {
      const pref = localStorage.getItem("sm.theme") || "device";
      const dark = pref === "dark" || (pref === "device" && window.matchMedia("(prefers-color-scheme: dark)").matches);
      document.documentElement.dataset.theme = dark ? "dark" : "light";

      const en = localStorage.getItem("sm.lang") === "en";
      document.documentElement.lang = en ? "en" : "tr";
      document.title = en
        ? "Istanbul Transit — Metro, metrobus & bus"
        : "İstanbul Ulaşım — Metro, metrobüs & otobüs";
      const desc = document.querySelector('meta[name="description"]');
      if (desc) {
        desc.setAttribute(
          "content",
          en
            ? "Next departures for Istanbul metro, tram, metrobus and bus lines. Official timetables, live line status and IETT stop arrivals."
            : "İstanbul metro, tramvay, metrobüs ve otobüs hatlarında sıradaki sefer kaç dakika sonra? Resmî tarifeler, canlı hat durumu ve İETT durak varışları."
        );
      }
      const manifest = document.querySelector('link[rel="manifest"]');
      if (manifest) manifest.href = en ? "/manifest.en.webmanifest" : "/manifest.webmanifest";
    } catch {}
  </script>
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="icon" href="/icons/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="/icons/icon-192.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <header class="topbar">
    <button id="backBtn" class="icon-btn" hidden aria-label="Geri">←</button>
    <div class="brand">
      <div>
        <h1 id="brandTitle">Metro</h1>
        <p id="brandSub">İstanbul metro, metrobüs & otobüs</p>
      </div>
    </div>
    <button id="settingsBtn" class="icon-btn" aria-label="Ayarlar" title="Ayarlar">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <circle cx="12" cy="12" r="3"></circle>
        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
      </svg>
    </button>
  </header>

  <main id="view" aria-live="polite"></main>

  <div id="toast" class="toast" hidden></div>
  <div id="swipeBack" class="swipe-back" aria-hidden="true">←</div>

  <script src="https://sehirharitasiapi.ibb.gov.tr/api/map2.js"></script>
  <script type="module" src="/app.js"></script>
</body>
</html>
